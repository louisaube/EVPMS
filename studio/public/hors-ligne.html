<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E5FD9" />
    <title>Hors ligne · EVP</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #EFF3FF; color: #262C45; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 28rem; padding: 1.5rem; text-align: center; }
      h1 { color: #2A43A8; font-size: 1.75rem; }
      button { min-height: 46px; padding: 0 24px; border: 0; border-radius: 24px; background: #3E5FD9; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #2A43A8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>EVP</h1>
      <p>Vous êtes hors ligne. EVP n'affiche aucune donnée RH hors ligne. Reconnectez-vous pour continuer.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
