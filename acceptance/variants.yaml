# Variantes de l'API de test (propriété de la QA ; lues par scripts/variantes.py).
#
# L'API de test est un processus distinct des tests : son environnement est fixé à son démarrage.
# - `api/.env.test` = variables actives de api/.env.template + l'environnement de la variante `default`, réécrit par la
#   cuisine : `cd api && NODE_ENV=test bash scripts/server/start.sh` donne la variante par défaut.
# - Une autre variante est démarrée par la cuisine avec ses variables `env` en plus (elles priment) ; une valeur vide
#   retire la variable. `generate` crée sur la machine une valeur de test jamais versionnée (rsa-private-key-pem).
#   `jest_env` est passé aux tests seulement.
# - Chaque fichier de recette tourne contre la variante dont un motif `files` le désigne, sinon contre `default`.
#   Les tests lisent l'environnement de l'API sous test dans le fichier désigné par ACCEPTANCE_ENV_FILE.
# Valeurs de test factices uniquement, jamais une vraie clé.
default: fake

variants:
  fake:
    description: >-
      Pilote fake des sources (fixtures de la v1) et Google configuré par des identifiants de substitution avec ses adresses
      officielles ; suites du socle et de la v1 (D-0003, COVERAGE-v2-evp-sources « Effets sur la suite de la v1 »).
    env:
      EVP_SOURCES_DRIVER: fake
      GOOGLE_CLIENT_ID: local-test-double.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: local-test-double
      GOOGLE_PUBLIC_ORIGIN: http://localhost:4000

  real:
    description: >-
      Lecteurs réels pointés vers les serveurs factices que démarrent les tests de la v2 (COVERAGE-v2-evp-sources,
      « Interface des doubles de test (v2) ») ; fichiers standard de v2-evp-sources.
    files:
      - acceptance-v2-google-sign-in.test.ts
      - acceptance-v2-sources-*.test.ts
    env:
      EVP_SOURCES_DRIVER: real
      GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-client-secret-000999
      GOOGLE_PUBLIC_ORIGIN: http://localhost:4000
      GOOGLE_AUTH_URL: http://127.0.0.1:4301/google/auth
      GOOGLE_TOKEN_URL: http://127.0.0.1:4301/google/token
      GOOGLE_CERTS_URL: http://127.0.0.1:4301/google/certs
      SHEETS_BASE_URL: http://127.0.0.1:4302/sheets
      SHEETS_TOKEN_URL: http://127.0.0.1:4302/sheets-token
      SHEETS_SPREADSHEET_ID: test-spreadsheet-id
      SHEETS_CLIENT_EMAIL: evp-reader@test-project.iam.gserviceaccount.com
      PAYFIT_BASE_URL: http://127.0.0.1:4303
      PAYFIT_INTROSPECT_URL: http://127.0.0.1:4303/introspect
      PAYFIT_API_KEYS: '[{"siret":"11111111111111","apiKey":"test-payfit-key-company-a-0001"},{"siret":"22222222222222","apiKey":"test-payfit-key-company-b-0002"}]'
      PAYFIT_RETRY_DELAY_MS: 200
      PAYFIT_ABSENCE_TYPES_FILE: acceptance/fixtures/payfit-absence-types.test.json
      AQOONA_URLS: '[{"label":"Aqoona Alpha","url":"http://127.0.0.1:4311/aqoona/alpha?token=test-aqoona-token-alpha-000111"},{"url":"http://127.0.0.1:4311/aqoona/beta?token=test-aqoona-token-beta-000222"}]'
      AQOONA_MAPPING_FILE: acceptance/fixtures/aqoona-mapping.test.json
    generate:
      SHEETS_PRIVATE_KEY: rsa-private-key-pem

  pros:
    description: >-
      v3-evp-acces-contrats-siret : lecteurs réels pointés vers les serveurs factices que démarrent les tests de la v3
      (Google, PayFit à 40 clés, adresse Aqoona « Pros » unique avec securityCheck, fichier de correspondance au format
      « Pros » acceptance/fixtures/aqoona-mapping-pros.test.json). Ports propres à cette variante (4401 à 4403, 4411).
      L'adresse Aqoona configurée porte déjà un dateBegin et un dateEnd périmés (à remplacer par la lecture), un paramètre
