      Lecteurs réels sans secret Google ni configuration des sources : google_not_configured, 503 de start, état
      UNAVAILABLE et sources.not_configured sans repli sur les fixtures (D-0003).
    files:
      - acceptance-v2-unconfigured.test.ts
    env:
      EVP_SOURCES_DRIVER: real
      GOOGLE_CLIENT_SECRET: ''
