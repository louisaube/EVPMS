# Questions pour le propriétaire : specifications/evp/implementation-plans/v3-evp-acces-contrats-siret/questions.yaml
# Cinq questions (trois du frontend, deux du backend). Chacune change ce qui est construit et donc la recette ; le défaut recommandé est écrit dans les plans.
- id: Q-EVP-09
  titre: Qui corrige la liaison Google d'un compte privilégié (RH, administratrice, superadmin)
  regles: [rule-evp-access-privileged-google-fix]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Le compte Google de Marine (RH) a été recréé : sa connexion est refusée et son accès est encore lié à l'ancien compte Google. Louis (superadmin) ouvre l'écran Accès pour la dépanner."
  options:
    - code: A
      libelle: Non, comme aujourd'hui les comptes privilégiés ne se gèrent pas depuis l'écran Accès ; le déblocage se fait hors application
      cout: leger
      ouvre: []
      resultat: "Louis ne voit pas Marine dans la liste ; délier son accès ou en changer l'adresse est refusé par l'API. Elle reste bloquée jusqu'à une correction en base."
      test: { route: "POST /access-accounts/{id}/unlink-google", entree: "appelant superadmin, compte RH lié à un compte Google", attendu: "403 access.privileged_account, liaison inchangée" }
    - code: B
      libelle: Le superadmin seul peut changer l'adresse et délier l'accès des comptes RH et administratrice (jamais le sien)
      cout: lourd
      ouvre: [affichage des comptes privilégiés dans la liste du superadmin seul, filtre « Rôle » élargi, actions limitées à « Modifier l'adresse » et « Délier le compte Google », règle rule-evp-access-no-privileged à rouvrir, protection du dernier superadmin]
      resultat: "Louis voit Marine dans la liste, délie son accès : sa connexion suivante relie son nouveau compte Google. Les autres champs de son compte restent non modifiables."
      test: { route: "POST /access-accounts/{id}/unlink-google", entree: "appelant superadmin, compte RH lié à un compte Google", attendu: "200, googleLinked false" }
  defaut: A

- id: Q-EVP-10
  titre: Contrats proposés aux crèches qui partagent un même SIRET
  regles: [rule-evp-siret-shared-contracts]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Les crèches Alpha et Bêta portent le même SIRET, donc la même société PayFit. Camille a un contrat actif dans cette société ; le planning Aqoona ne la montre qu'à Alpha. Une directrice de Bêta ouvre « Nouvelle absence » et cherche Camille."
  options:
    - code: A
      libelle: Tous les contrats actifs et à venir de la société sont proposés à chacune des crèches qui partagent le SIRET
      cout: leger
      ouvre: []
      resultat: "Camille est proposée à Bêta : la directrice de Bêta voit aussi les noms des salariées d'Alpha, la société PayFit ne distinguant pas les crèches."
      test: { route: "GET /creches/{code}/contracts?search=Camille", entree: "code = bêta, deux crèches au même SIRET, planning Aqoona de Camille rattaché à alpha seulement", attendu: "200, items contient le contrat de Camille" }
    - code: B
      libelle: Pour les crèches qui partagent un SIRET, seuls les contrats des salariées vues dans le planning Aqoona de la crèche (fenêtre de la dernière lecture) sont proposés
      cout: lourd
      ouvre: [conduite quand Aqoona n'a jamais été lue, salariée absente du planning (congé long, embauche récente), message de liste vide propre à ce cas]
      resultat: "Camille n'est pas proposée à Bêta, seulement à Alpha. Une salariée absente de tout planning n'est proposée à aucune des deux crèches."
      test: { route: "GET /creches/{code}/contracts?search=Camille", entree: "code = bêta, deux crèches au même SIRET, planning Aqoona de Camille rattaché à alpha seulement", attendu: "200, items vide" }
  defaut: A

- id: Q-EVP-11
  titre: Session déjà ouverte au moment où l'accès est délié de son compte Google
  regles: [rule-evp-access-unlink-session]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Camille est connectée (session de 8 h) avec son ancien compte Google. Marine délie l'accès de Camille de ce compte depuis l'écran Accès, puis Camille envoie une nouvelle requête avec sa session."
  options:
    - code: A
      libelle: La session ouverte reste valide jusqu'à ses 8 heures ; seule la connexion suivante est concernée
      cout: leger
      ouvre: []
      resultat: "Camille continue de travailler jusqu'à l'expiration de sa session ; l'ancien compte Google ne peut plus ouvrir de nouvelle session."
      test: { route: "GET /profile", entree: "cookie de session de Camille ouvert avant la liaison levée", attendu: "200" }
    - code: B
      libelle: La session ouverte est coupée au moment où l'accès est délié
      cout: lourd
      ouvre: [version de session par compte, effet d'un changement d'adresse ou d'un retrait sur les sessions ouvertes, migration]
      resultat: "La requête suivante de Camille est refusée ; elle doit se reconnecter, et la connexion suivante lie son compte Google actuel."
      test: { route: "GET /profile", entree: "cookie de session de Camille ouvert avant la liaison levée", attendu: "401 security.invalid_token" }
  defaut: A

# Questions du backend (agent de plan du module)
- id: Q-EVP-12
  titre: NIR d'Aqoona porté par plusieurs collaboratrices de la même société PayFit
  regles: [rule-evp-aqoona-nir-ambiguous]
  effet_recette: oui
  decideur: proprietaire
  observable: oui
  situation: "Une ligne Aqoona « Pros » porte un NIR que deux collaboratrices de la société de la crèche portent aussi dans PayFit (fiche en doublon). Le prénom et le nom d'Aqoona désignent sans ambiguïté l'une des deux."
  options:
    - code: A
      libelle: Ne rien rattacher et signaler « Rattachement par NIR ambigu », sans retomber sur les noms
      cout: leger
      ouvre: []
      resultat: "Le créneau est stocké sans collaboratrice ; l'anomalie « Planning non rattaché » porte le détail « Rattachement par NIR ambigu »."
      test: { route: "POST /sources/aqoona/refresh", entree: "ligne avec NIR porté par deux collaboratrices de la société, noms uniques", attendu: "créneau stocké sans employee_id, anomalie PLANNING_UNMATCHED « Rattachement par NIR ambigu »" }
    - code: B
      libelle: Retomber sur le prénom et le nom comme pour un NIR sans correspondance
      cout: leger
      ouvre: [une fiche en doublon dans PayFit passe inaperçue, la désignation par les noms peut contredire le NIR]
      resultat: "Le créneau est rattaché à la collaboratrice désignée par les noms, sans anomalie."
      test: { route: "POST /sources/aqoona/refresh", entree: "ligne avec NIR porté par deux collaboratrices de la société, noms uniques", attendu: "créneau stocké avec l'employee_id de la collaboratrice désignée par les noms, aucune anomalie" }
  defaut: A

- id: Q-EVP-13
  titre: Où les fixtures du pilote fake portent le NIR des collaboratrices PayFit
  regles: [rule-evp-aqoona-nir-transient-key, rule-evp-aqoona-nir-never-stored]
  effet_recette: non
  decideur: defaut
  observable: non                 # configuration des fixtures : les deux options ont le même comportement par l'API
  situation: "La recette sème, sous le pilote fake, des fichiers payfit.json et aqoona.json ; le rapprochement par NIR a besoin du NIR de la collaboratrice PayFit, qui ne doit jamais entrer en base."
  options:
    - code: A
      libelle: Un champ facultatif `nir` sur chaque collaboratrice de payfit.json, lu seulement pendant la lecture Aqoona et jamais copié dans payfit_employees ; un `nirUnavailable` facultatif (liste de SIRET) simule la portée absente
      cout: leger
      ouvre: []
      resultat: "Les tests posent le NIR fictif dans payfit.json et vérifient qu'il n'est ni en base, ni dans les réponses, ni dans l'audit, ni dans les journaux."
    - code: B
      libelle: Un fichier de fixture séparé `payfit-nir.json` (SIRET, collaboratrice, NIR), appelé en plus dans calls.log
      cout: leger
      ouvre: [format du fichier, ligne ajoutée à calls.log]
      resultat: "Même comportement observable ; payfit.json ne change pas du tout."
  defaut: A
