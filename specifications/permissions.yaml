    allow: [admin]
    ownership: none
    rules: [rule-foundation-import-users-admin-only, rule-foundation-import-two-steps, rule-foundation-import-preview-content, rule-foundation-import-trapped-files-refused]
    provenance: user
    cross_owner_tests: []
  - method: GET
    path: /users/imports/:importId/errors
    action: users:import-errors
    allow: [admin]
    ownership: own
    rules: [rule-foundation-import-users-admin-only, rule-foundation-import-preview-content, rule-foundation-import-preview-owner]
    provenance: user
    cross_owner_tests:
      - "[rule-foundation-import-preview-owner] another administrator listing the errors of a preview gets the same 404 import.preview_not_found as for an unknown id"
  - method: POST
    path: /users/imports/:importId/confirm
    action: users:import-confirm
    allow: [admin]
    ownership: own
    rules: [rule-foundation-import-users-admin-only, rule-foundation-import-confirm-valid-only, rule-foundation-import-audited, rule-foundation-import-no-double, rule-foundation-import-preview-owner]
    provenance: user
    cross_owner_tests:
      - "[rule-foundation-import-preview-owner] another administrator confirming a preview gets the same 404 import.preview_not_found as for an unknown id and nothing is created"

  # ---------------------------------------------------------------------------------------------
  # Version v1-evp (EVP, préparation et suivi des absences).
  # The permissions checker probes with NON-EVP socle accounts (user, admin). Every route gated by an
  # EVP capability therefore answers 403 to both, hence `allow: []`; the role-by-role matrix (directrice,
  # RO, RH, ADMINISTRATRICE, SUPERADMIN) is proved by acceptance/acceptance-evp-roles-contract.test.ts.
  # `ownership: own` marks the routes whose result depends on the crèche perimeter of the caller.
  # ---------------------------------------------------------------------------------------------
  # Version v2-evp-sources: no operation is added or removed (decision D-0005, option A of Q-EVP-01: server flow with
  # authorisation code; POST /google-sign-in/credential does not exist). The access (method, path, action, allow,
  # ownership) of every operation below is unchanged; the entries of the Google sign-in and of the sources only gain
  # the rules of v2 that they now carry. GET /sources changes its response (lastError, addresses, state PARTIAL).
  - method: GET
    path: /service-status
    action: null
    allow: [anonymous, user, admin]
    ownership: none
    rules: [rule-evp-login-service-status, rule-evp-login-public-no-hr-data, rule-evp-google-endpoints-configurable]
    provenance: user
    cross_owner_tests: []
  - method: GET
    path: /google-sign-in/start
    action: null
    allow: [anonymous, user, admin]
    ownership: none
    rules: [rule-evp-login-google-only, rule-evp-login-safe-redirect, rule-evp-google-flow-redirect, rule-evp-google-endpoints-configurable, rule-evp-google-domain-configurable, rule-evp-google-scopes-minimal]
    provenance: user
    cross_owner_tests: []
  - method: GET
    path: /google-sign-in/callback
    action: null
    allow: [anonymous, user, admin]
    ownership: none
    # Version v3-evp-acces-contrats-siret: rule-evp-google-sub-email-change (v2: the session opened) is replaced by
    # rule-evp-google-sub-email-mismatch (no session, erreur=adresse_modifiee) and rule-evp-google-sub-recreated
    # (erreur=compte_recree); access, method, path and action are unchanged.
    rules: [rule-evp-login-google-only, rule-evp-login-domain-not-enough, rule-evp-login-single-denial, rule-evp-login-safe-redirect, rule-evp-google-token-verified-server, rule-evp-google-signature, rule-evp-google-certs-cache, rule-evp-google-certs-rotation, rule-evp-google-certs-fail-closed, rule-evp-google-aud, rule-evp-google-iss, rule-evp-google-exp, rule-evp-google-hd, rule-evp-google-email-verified, rule-evp-google-flow-redirect, rule-evp-google-sub-identity, rule-evp-google-sub-binding, rule-evp-google-sub-mismatch, rule-evp-google-sub-email-mismatch, rule-evp-google-sub-recreated, rule-evp-google-sub-address-fix, rule-evp-login-mismatch-admissible-only, rule-evp-login-mismatch-no-address, rule-evp-login-mismatch-no-write, rule-evp-google-sub-unique, rule-evp-google-error-causes, rule-evp-google-sign-in-audit, rule-evp-session-8h, rule-evp-secrets-never-exposed]
    provenance: user
    cross_owner_tests: []
  - method: GET
    path: /profile
    action: profile:read
    allow: []
    ownership: none
    rules: [rule-evp-capabilities-list, rule-evp-rights-rechecked, rule-evp-no-store]
    provenance: user
    cross_owner_tests: []
  - method: GET
