    provenance: user
    cross_owner_tests: []
  # Version socle-import-excel: import of accounts (generic mechanism of the foundation applied to users).
  # The four routes are reserved to administrators. A preview is private to the administrator who created
  # it (rule-foundation-import-preview-owner): errors and confirm are `ownership: own`, another administrator
  # gets the same 404 as for an unknown id. The probe calls the routes without body: guards answer 401/403 first.
  - method: GET
    path: /users/imports/specification
    action: users:import-specification
    allow: [admin]
    ownership: none
    rules: [rule-foundation-import-users-admin-only, rule-foundation-import-users-columns, rule-foundation-import-formats]
